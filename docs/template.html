function updateRail(id){const rail=$('#'+id+'-rail'),box=rail.querySelector('.scroller');const overflow=box.scrollWidth>box.clientWidth+2;rail.dataset.more=String(overflow);rail.dataset.end=String(box.scrollLeft+box.clientWidth>=box.scrollWidth-3);const btn=rail.querySelector('.scroll-next');if(btn){const end=rail.dataset.end==='true';btn.textContent=end?'‹':'›';btn.setAttribute('aria-label',(end?'向左':'向右')+'滚动'+(id==='source'?'来源':'类型')+'选项')}}
function updateRails(){['source','category'].forEach(updateRail)}
function selected(id,field,val){$$('#'+id+' .chip').forEach(b=>{const on=b.dataset[field]===val;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))})}
function init(){const sources=[...new Set(cards.map(c=>sourceKey(c.source)).filter(Boolean))];const present=[...new Set(cards.flatMap(c=>Array.isArray(c.tags)?c.tags:[]))];const categories=[...order.filter(c=>present.includes(c)),...present.filter(c=>!order.includes(c))];
 $('#sources').innerHTML='<button type="button" class="chip" data-source="all">全部来源</button>'+sources.map(s=>`<button type="button" class="chip" data-source="${escapeHTML(s)}">${escapeHTML(labels[s]||s)}</button>`).join('');
 $('#categories').innerHTML='<button type="button" class="chip" data-category="all">全部类型</button>'+categories.map(c=>`<button type="button" class="chip" data-category="${escapeHTML(c)}" ${tones[c]?`data-tone="${tones[c]}"`:''}>${escapeHTML(c)}</button>`).join('');
 selected('sorts','sort','latest');selected('sources','source','all');selected('categories','category','all');
 $('#total').textContent=cards.length;const updated=Math.max(0,...cards.map(c=>stamp(c.fetched_at)));$('#updated').textContent=updated?'最近收录 '+formatTime(new Date(updated).toISOString()):'收录时间未知';
 const dark=document.documentElement.dataset.theme==='dark';$('#theme').textContent=dark?'☀ 主题':'☾ 主题';$('#theme').setAttribute('aria-label',dark?'切换浅色主题':'切换深色主题');
 document.querySelector('meta[name="theme-color"]').content=dark?'#111827':'#f6f7fa';requestAnimationFrame(updateRails);if('ResizeObserver' in window){const ro=new ResizeObserver(updateRails);['sources','categories'].forEach(id=>ro.observe($('#'+id)))}else window.addEventListener('resize',updateRails);
 ['sources','categories'].forEach(id=>$('#'+id).addEventListener('scroll',()=>updateRail(id==='sources'?'source':'category'),{passive:true}));
 refresh();
}
function isRecent(c){const t=time(c),delta=Date.now()-t;return !!t&&delta>=0&&delta<864e5}
function makeEntries(){const list=cards.filter(c=>(state.source==='all'||sourceKey(c.source)===state.source)&&(state.category==='all'||(Array.isArray(c.tags)?c.tags:[]).includes(state.category))&&(!state.query||String(c.title||'').toLocaleLowerCase().includes(state.query)));
 list.sort((a,b)=>state.sort==='score'?((Number(b.score)||0)-(Number(a.score)||0)||stamp(b.fetched_at)-stamp(a.fetched_at)):time(b)-time(a));
 const enriched=list.map(c=>({c,key:state.sort==='score'?(isRecent(c)?'recent':'earlier'):bjDay(c)}));
 return state.sort==='score'?[...enriched.filter(x=>x.key==='recent'),...enriched.filter(x=>x.key==='earlier')]:enriched;
}
function renderCard(c){const href=safeURL(c.url),tagList=Array.isArray(c.tags)?c.tags:[],title=escapeHTML(c.title||'未命名帖子');const titleHTML=href?`<a href="${escapeHTML(href)}" target="_blank" rel="noopener noreferrer">${title}</a>`:`<a aria-disabled="true">${title}</a>`;
 const tagHTML=tagList.map(t=>`<button type="button" class="tag" data-tag="${escapeHTML(t)}" ${tones[t]?`data-tone="${tones[t]}"`:''} aria-pressed="${String(state.category===t)}" title="只看${escapeHTML(t)}">${escapeHTML(t)}</button>`).join('');
 const score=Number(c.score);return `<article class="card"><div class="title-wrap"><h3 class="title">${titleHTML}</h3></div><div class="tags">${tagHTML}</div><div class="card-foot"><span class="source">${escapeHTML(sourceName(c.source))}</span><span class="score" title="关键词命中数">匹配 ${Number.isFinite(score)?score:0}</span><time class="post-time" ${c.created_at||c.fetched_at?`datetime="${escapeHTML(c.created_at||c.fetched_at)}"`:''} title="${c.created_at?'发布时间':'收录时间'} · 北京时间">${c.created_at?'':'收录于 '}${formatTime(c.created_at||c.fetched_at)}</time></div></article>`
}
function sectionLabel(k){if(k==='recent')return '近 24 小时';if(k==='earlier')return '更早的信息';const today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);return k===today?'今天 · '+k:k}
function addBatch(){const total=state.entries.length;let end=Math.min(state.shown+40,total);
 if(end<total){const cutKey=state.entries[end-1].key;let gs=end-1;while(gs>state.shown&&state.entries[gs-1].key===cutKey)gs--;let ge=end;while(ge<total&&state.entries[ge].key===cutKey)ge++;const vis=end-gs,hidden=ge-end;
  if(vis%2===1&&hidden>=1)end++}
 for(let i=state.shown;i<end;){const key=state.entries[i].key;let j=i+1;while(j<end&&state.entries[j].key===key)j++;let section=state.sections.get(key);
 if(!section){section=document.createElement('section');section.className='group';section.dataset.key=key;section.innerHTML=`<div class="group-head"><h2>${escapeHTML(sectionLabel(key))}</h2><div class="line"></div><span class="portion"></span></div><div class="cards"></div>`;$('#results').append(section);state.sections.set(key,section)}
 section.querySelector('.cards').insertAdjacentHTML('beforeend',state.entries.slice(i,j).map(x=>renderCard(x.c)).join(''));section.querySelector('.portion').textContent=`显示 ${section.querySelectorAll('.card').length} / ${state.totals.get(key)} 条`;i=j}
 state.shown=end;$('#more').hidden=end>=state.entries.length;$('#more').textContent=`继续查看 · 剩余 ${state.entries.length-end} 条`;$('#result-summary').textContent=`显示 ${end} / ${state.entries.length} 条`;$('#count').textContent=`${state.entries.length} / ${cards.length} 条`;
}
function refresh(){state.entries=makeEntries();state.shown=0;state.sections=new Map();state.totals=new Map();for(const x of state.entries)state.totals.set(x.key,(state.totals.get(x.key)||0)+1);state.recentSignature=state.sort==='score'?state.entries.filter(x=>x.key==='recent').map(x=>x.c.id).join('|'):'';
 $('#results').replaceChildren();if(!state.entries.length){$('#results').innerHTML='<div class="no-results"><strong>没有找到匹配的信息</strong><p>换个关键词，或清除筛选条件。</p><button class="reset" data-clear="true" type="button">清除筛选</button></div>';$('#count').textContent=`0 / ${cards.length} 条`;$('#result-summary').textContent='0 条';$('#more').hidden=true}else addBatch();
 $('#reset').classList.toggle('dirty',state.query!==''||state.source!=='all'||state.category!=='all'||state.sort!=='latest')
}
function reset(){clearTimeout(pending);state.sort='latest';state.source='all';state.category='all';state.query='';$('#search').value='';selected('sorts','sort','latest');selected('sources','source','all');selected('categories','category','all');refresh()}
function setCategory(c){clearTimeout(pending);state.query=$('#search').value.trim().toLocaleLowerCase();state.category=c;selected('categories','category',c);refresh();const b=$$('#categories .chip').find(x=>x.dataset.category===c);b?.scrollIntoView({block:'nearest',inline:'nearest'})}
let pending;$('#search').addEventListener('input',e=>{clearTimeout(pending);if(e.isComposing)return;pending=setTimeout(()=>{state.query=$('#search').value.trim().toLocaleLowerCase();refresh()},110)});$('#search').addEventListener('compositionend',()=>{clearTimeout(pending);state.query=$('#search').value.trim().toLocaleLowerCase();refresh()});
$('#reset').addEventListener('click',reset);$('#more').addEventListener('click',e=>{const index=state.shown;addBatch();if(e.detail===0||$('#more').hidden){document.querySelectorAll('.card')[index]?.querySelector('.title a[href]')?.focus({preventScroll:true})}});
$('#theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark',theme=dark?'light':'dark';document.documentElement.dataset.theme=theme;$('#theme').textContent=dark?'☾ 主题':'☀ 主题';$('#theme').setAttribute('aria-label',dark?'切换深色主题':'切换浅色主题');document.querySelector('meta[name="theme-color"]').content=dark?'#f6f7fa':'#111827';try{localStorage.setItem('ai-welfare-theme',theme)}catch{}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.clear){reset();return}if(b.dataset.sort){clearTimeout(pending);state.query=$('#search').value.trim().toLocaleLowerCase();state.sort=b.dataset.sort;selected('sorts','sort',state.sort);refresh()}else if(b.dataset.source){clearTimeout(pending);state.query=$('#search').value.trim().toLocaleLowerCase();state.source=b.dataset.source;selected('sources','source',state.source);refresh()}else if(b.dataset.category){setCategory(b.dataset.category)}else if(b.dataset.tag){setCategory(b.dataset.tag);const target=$$('#categories .chip').find(x=>x.dataset.category===state.category);target?.focus({preventScroll:true})}else if(b.dataset.rail){$('#'+b.dataset.rail).scrollBy({left:b.closest('.rail').dataset.end==='true'?-190:190,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}});
function refreshClock(){if(state.sort==='score'){const signature=state.entries.filter(x=>isRecent(x.c)).map(x=>x.c.id).join('|');if(signature!==state.recentSignature)refresh()}else{for(const [key,el] of state.sections){const label=sectionLabel(key),node=el.querySelector('h2');if(node.textContent!==label)node.textContent=label}}}
setInterval(()=>{if(!document.hidden)refreshClock()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshClock()});init();
</script>
</body></html>
