  --bar:#4ED08C;--bar-soft:#356f50;--bar-warn:#a8802f;--bar-bad:#a93f3f;--bar-none:#2c3949;
  --date:#8b97a6;--ratetext:#a9b5c4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  --fab-shadow:0 2px 8px rgba(0,0,0,.35),0 14px 30px -10px rgba(0,0,0,.5);
}
[data-tone=purple]{--t-bg:#f0edff;--t-fg:#4b3f92;--t-border:#d5cdf7}
[data-tone=green]{--t-bg:#e8f7ee;--t-fg:#12633c;--t-border:#bfe7cd}
[data-tone=teal]{--t-bg:#e4f6f1;--t-fg:#0a6b5e;--t-border:#aee3d6}
[data-tone=blue]{--t-bg:#e9f2ff;--t-fg:#1b4a86;--t-border:#c3d9f6}
[data-tone=amber]{--t-bg:#fff3da;--t-fg:#855100;--t-border:#f5d79c}
[data-tone=rose]{--t-bg:#ffecf2;--t-fg:#8f3355;--t-border:#f6c6d8}
html[data-theme=dark] [data-tone=purple]{--t-bg:#362e54;--t-fg:#d8c5ff;--t-border:#5a4891}
html[data-theme=dark] [data-tone=green]{--t-bg:#183e34;--t-fg:#a7e9c8;--t-border:#30684f}
html[data-theme=dark] [data-tone=teal]{--t-bg:#1a3e3b;--t-fg:#a7e5db;--t-border:#316c63}
html[data-theme=dark] [data-tone=blue]{--t-bg:#1d3350;--t-fg:#bcd6ff;--t-border:#37547f}
html[data-theme=dark] [data-tone=amber]{--t-bg:#4a3820;--t-fg:#f6d492;--t-border:#775a2a}
html[data-theme=dark] [data-tone=rose]{--t-bg:#4a2b38;--t-fg:#f6c3d7;--t-border:#754257}
/* 强调色（实心）：CTA / 卖点标签 / 倍率块左条用它，和淡色 tint 拉开层级 */
[data-tone=purple]{--t-solid:#5b4bd6;--t-solid-ink:#fff}
[data-tone=green]{--t-solid:#178a5a;--t-solid-ink:#fff}
[data-tone=teal]{--t-solid:#0e8577;--t-solid-ink:#fff}
[data-tone=blue]{--t-solid:#2b62b8;--t-solid-ink:#fff}
[data-tone=amber]{--t-solid:#b0731a;--t-solid-ink:#fff}
[data-tone=rose]{--t-solid:#b8455f;--t-solid-ink:#fff}
/* 等级徽章直接用 tone 变量：data-tone 才是 JS 实际写在元素上的属性 */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.shell{width:min(1080px,calc(100% - 28px));margin:auto;padding:18px 0 56px}
a{color:var(--primary);text-decoration:none}

/* 头部 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:.95rem}
.brand .logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--primary),#7f83e8);display:grid;place-items:center;color:#fff;font-size:.85rem}
.top .spacer{flex:1}
.btn-ghost{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:6px 11px;font-size:.79rem;cursor:pointer;font-family:inherit}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-ghost.back{font-weight:600}
@media(max-width:600px){
  /* 返回按钮换到主题下面一行、右对齐（用户 2026-10-12：移动端把"返回信息列表"放到主题下边）。
     强制换行必须靠一个占满行宽的元素，光给按钮 margin-left:auto 只会让它留在同一行右侧。 */
  .top .brk{display:block;flex-basis:100%;height:0;margin:0}
  .btn-ghost.back{margin-left:auto}

  /* ---- 底部三件套：邀请码拿最大宽度（用户 2026-10-12）----
     实测 320px / 360px 下"邀请码 + 注册"各占等分时，S3AI 的 8 位码 06YZsccH
     会被挤出按钮（分别溢出 18px / 8px）→ 看着像没写全/没写码。
     口径：邀请码按钮占满剩余空间（1fr），小绿卡与注册按钮各自收到**内容宽度**；
     移动端再去掉"邀请码""近3天"两个标签与注册后的箭头，把宽度全让给码本身。
     注册按钮尺寸（用户 2026-10-12 追加）：原状只有 28px 宽（≈两个汉字宽、无内边距），
     看着像没做完的碎片。口径 = **内容盒子宽度翻倍到 56px**并给足内边距与最小触达高度，
     空间从邀请码的富余里借（改前码余量 66~346px，借完仍 >0，不影响长邀请码）。
     桌面端（>600px）保持原样：标签齐全、邀请码与注册等宽等高。 */
  .cfoot{grid-template-columns:auto minmax(0,1fr) auto}
  .hmini{padding:0 6px}
  .hmini .lb{display:none}
  .invite .lb{display:none}
  .golink .arw{display:none}
  /* 注册按钮加宽。必须放在这里（同文件靠后的位置）：L289 的
     `.cfoot .invite,.cfoot .golink{box-sizing:border-box}` 选择器权重更高，
     写在前面（L73 一带）会被它吃掉 box-sizing，width 落成"内容宽度"=30px 一个字都不多。
     用 `min-width` + border-box 直接给右侧那格兜底：内容盒 56px（≈原 30px 的 1.9 倍），
     即"注册"文字 30px + 左右内边距 13px×2。text-align 让文字居中。 */
  .cfoot .golink{min-width:56px;width:auto;padding:0 13px;box-sizing:border-box;
                 display:inline-flex;align-items:center;justify-content:center}
}
@media(max-width:560px){.top{gap:8px}.btn-ghost{padding:6px 9px;font-size:.75rem}}


/* Hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:8px}
.hero h1{font-size:1.45rem;line-height:1.3;margin:0 0 8px}
.hero p{margin:0;color:var(--muted);font-size:.88rem;max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.stats b{color:var(--text);font-weight:700}
.stats .k{color:var(--hint);margin-right:5px}

/* 提示条 */

/* 控制区 */
.controls{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;margin-bottom:16px;box-shadow:var(--shadow)}
.searchrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:9px 12px 9px 33px;font-size:.86rem;font-family:inherit}
.search input:focus{outline:2px solid var(--soft);border-color:var(--primary)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:.85rem}
select{font-family:inherit;font-size:.82rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer}
.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--primary);width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:100px;padding:4px 11px;font-size:.78rem;cursor:pointer;font-family:inherit}
.chip:hover{background:var(--hover);color:var(--text)}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--primary);color:var(--primary);font-weight:650}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}

/* 分组 */
.group{margin-bottom:22px}
.group-head{display:flex;align-items:center;gap:9px;margin:0 2px 10px}
.group-head h2{font-size:.98rem;margin:0;font-weight:750}
.group-head .n{font-size:.76rem;color:var(--hint)}
.group-head .line{flex:1;height:1px;background:var(--line)}

/* 卡片 */
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,480px);gap:16px;align-items:stretch;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
.card /* 左栏用固定节奏（gap 16px）而不是把余量全塞进空隙：3 行模型时右栏偏矮，
   让它自己长高来对齐左栏（见 .mrow{flex:1}），两栏底边始终齐平。 */
.body{display:flex;flex-direction:column;justify-content:flex-start;gap:16px;min-width:0}  /* 左栏比右栏矮时把余量均摊到各档间距，而不是在按钮上方留一个空洞 */
.card .side{display:flex;flex-direction:column;gap:9px;min-width:0}
@media (max-width:820px){.card{grid-template-columns:1fr;gap:12px}}
.card.pin{border-color:var(--t-border);background:linear-gradient(180deg,var(--t-bg) 0%,var(--surface) 58%)}
/* ---- 左栏三层：品牌（logo+大字站名+状态）→ 卖点/倍率（强调色）→ CTA（实心） ---- */
.chead{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.sbrand{min-width:0;flex:1 1 190px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left}
.chead h3{font-size:1.34rem;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.015em;color:var(--text)}
.slogo{width:36px;height:36px;border-radius:11px;flex:0 0 auto;object-fit:contain;background:#fff;
  border:1px solid var(--line);box-shadow:0 1px 2px rgba(23,43,77,.07)}
.slogo.fb{display:flex;align-items:center;justify-content:center;background:var(--t-bg);border-color:var(--t-border);
  color:var(--t-fg);font-weight:800;font-size:1rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.submeta{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--hint);flex-wrap:wrap}
.submeta .v{font-variant-numeric:tabular-nums;font-weight:650;color:var(--muted)}
.submeta .k{color:var(--date)}
.lvl{margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bar);flex:0 0 auto}
.dot.warn{background:var(--bar-warn)}.dot.bad{background:var(--bar-bad)}.dot.none{background:var(--bar-none)}
.lvl{margin-left:auto;font-size:.76rem;font-weight:750;padding:3px 11px;border-radius:100px;
  border:1px solid var(--t-solid);background:var(--t-solid);color:var(--t-solid-ink);white-space:nowrap;
  box-shadow:0 1px 3px rgba(23,43,77,.12)}
.meta{font-size:.76rem;color:var(--hint);display:flex;flex-wrap:wrap;gap:6px 12px}
.meta .sep{color:var(--line)}
.desc{margin:0;font-size:.85rem;line-height:1.5;color:var(--muted);display:-webkit-box;
  -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.5em}
.tags{display:flex;flex-wrap:wrap;gap:6px}
/* 充值比例（付费渠道）：放标签行右端并 margin-left:auto 拉开距离。
   实测只有这一行有余量：身份行只剩 11px（再加会把站名挤到截断）、分组倍率行 0~1px（"其余 N 个"已贴内边距）、
   底部三件套行已满（再加会把邀请码挤没，那是修过一次的 bug）。
   刻意不用 data-tone：标签色是有语义的（公益/体验金/可签到…），中性灰才不会被当成第 6 个标签。 */
.rcg{flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:.7rem;
     padding:2px 10px;border-radius:100px;border:1px solid var(--line);background:var(--bg);
     color:var(--hint);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rcg i{font-style:normal;font-weight:500}
.rcg b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;padding:2px 9px;border-radius:100px;border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-fg);white-space:nowrap}
.tag.hi{background:var(--t-solid);border-color:var(--t-solid);color:var(--t-solid-ink);font-weight:750}

/* 健康度条带 */
/* 站点可用率小卡（近 3 天）：与邀请码/注册按钮同一行，高度与按钮对齐（35px） */
.hmini{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;height:35px;box-sizing:border-box;
       border-radius:10px;background:var(--bg);border:1px solid var(--line);padding:0 8px}
html[data-theme=dark] .hmini{background:#16202e}
.hmini .lb{font-size:.63rem;font-weight:700;color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.hmini .bars{display:flex;gap:3px;justify-content:flex-end;align-items:center}
.hmini .bars i{flex:0 0 auto;width:9px;height:15px;border-radius:3px;background:var(--bar-none)}
.hmini .bars i.ok{background:var(--bar)}
.hmini .bars i.soft{background:var(--bar-soft)}
.hmini .bars i.warn{background:var(--bar-warn)}
.hmini .bars i.bad{background:var(--bar-bad)}
.hrate b{color:var(--text);font-weight:700}
.hfam{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fam{font-size:.7rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:100px;padding:1px 8px}
.fam b{color:var(--text);font-weight:700}
.hnone{font-size:.78rem;color:var(--date);margin-top:5px}

/* 指定模型监控 */
.mblock{border:1px solid var(--line);border-radius:12px;padding:9px 11px 8px}
.side .mblock{flex:1 1 auto;display:flex;flex-direction:column}   /* 右栏只剩它：撑满，避免栏内出现空洞 */
.mbody > .mlegend{margin-top:auto}                               /* 图例贴块底 */
.mbody > /* 行高弹性：右栏比左栏矮时把行撑起来对齐；但设上限，避免长描述把行拉到很高 */
.mrow{flex:0 0 auto;height:61px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  /* 右栏比左栏矮时，把余量均摊进模型行（行内容垂直居中），表格撑满右栏、不留下一个空档 */   /* 两栏齐平：块沉到卡底 */
.mblock .mtitle{font-size:.7rem;color:var(--hint);font-weight:700;letter-spacing:.03em;margin-bottom:6px}
.mblock .mtitle span{font-weight:400;letter-spacing:0}
.mrow{padding:6px 0;border-top:1px solid var(--line)}
.mgroups{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.mrow:first-of-type{border-top:0}

/* ============ 卡片内强调体系（统一音量，别让所有元素一个大小声）============
   L1 实心：等级徽章 / 卖点标签 / 注册按钮 / 严重异常(≥6h)
   L2 淡底彩字：属性标签 / 直连-翻墙标识 / 免费倍率 / 一般异常 / 分组 chip
   L3 中性灰：收录与检测时间 / 站址 / 表头 / 图例 / 样本不足等提示
   两个区块标题同一款：--text + 750，配左侧 tone 强调条 —— 卡片里所有"卡片"共用一套语言。 */
.rblock,.mblock,.hmini{border-left:3px solid var(--t-solid)}
.mtitle{color:var(--text);font-size:.69rem}
.rtitle{color:var(--text)}
.mhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mhead .mtitle{margin-bottom:0}
.mtoggle{display:none;margin-left:auto;border:1px solid var(--line);background:var(--surface);
  color:var(--t-fg);border-radius:8px;padding:2px 9px;font-size:.68rem;font-weight:750;font-family:inherit;cursor:pointer}
.mtoggle:hover{border-color:var(--t-solid)}
.mbody{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;justify-content:space-between}
.mgrid .num.rate{font-weight:800}
.rchip b{font-weight:800}
/* 徽章三级：中性（样本不足等）= L3，异常 1~5h = L2 琥珀，异常 ≥6h = L1 实心琥珀 */
.mflag{font-size:.6rem;font-weight:650;color:var(--date);background:var(--soft);border:1px solid var(--line);
  border-radius:5px;padding:0 5px;flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.mflag.anom{color:#8a4b12;background:#fff3da;border-color:#f2d09a;font-weight:750}
.mflag.anom.severe{color:#fff;background:#bd7415;border-color:#bd7415;font-weight:800;
  box-shadow:0 1px 3px rgba(189,116,21,.35)}
.mgrid .cname .mflag{font-size:.6rem}   /* 模型名旁的徽章：沿用上面三级配色，不再单独染色 */
/* 模型下架（通用规则）：比"异常 Nh"更根本（模型根本不在售/不在分组里）→ 实心红，顶掉异常徽章 */
.mflag.down{color:#fff;background:#c33b3b;border-color:#c33b3b;font-weight:800;
  box-shadow:0 1px 3px rgba(195,59,59,.35)}
html[data-theme=dark] .mflag.down{color:#3a0d0d;background:#f08a8a;border-color:#f08a8a}
html[data-theme=dark] .mflag.anom{color:#f6d492;background:#4a3820;border-color:#775a2a}
html[data-theme=dark] .mflag.anom.severe{color:#2a1a06;background:#dfa245;border-color:#dfa245}
@media(max-width:1000px){
  /* 两栏布局下左栏宽度随视口线性变窄（900px 时只有 340px），"邀请码 + 码 + 复制"放不下 →
     先去掉"复制"二字（整块按钮本来就可点，title 里写了"点一下复制邀请码"），码本身必须可见。 */
  .cfoot .invite{padding:0 8px}
  .cfoot .invite .cp{display:none}
}
@media(max-width:820px){
  .mtoggle{display:inline-flex}
  /* 默认收起**由 CSS 决定**，不由 JS 写属性决定 —— 这样窄屏下的默认态不依赖任何脚本时机。
     data-user 只表达"用户手动点过"：0=手动收起（桌面也收起）、1=手动展开（窄屏也展开）。
     背景：早先是 JS 渲染时按视口写 data-open，而重绘绑定在渲染循环上；后台标签页 /
     无桌面会话（计划任务里的无头浏览器）会限流渲染循环、rAF 只剩 1 帧、matchMedia 的
     change 都不派发，于是窄屏仍停在桌面端的展开态。默认态交给 CSS 就没这个依赖。 */
  .mblock:not([data-user="1"]) .mbody{display:none}
  /* 窄屏身份行：徽章必须在右上角（与桌面端相对位置一致），同时信息行不能再折行 ——
     光靠 flex 做不到：徽章占宽 → 品牌块被挤窄 → "收录·检测·域名"折成两行。
     改 grid：第 1 行 = logo | 标题行(+直连) | 徽章(贴右)；第 2 行 = 信息行横跨整行（拿满宽度，一行放得下）。
     .sbrand 用 display:contents 解开，让标题行/信息行直接成为 grid 子项。 */
  .chead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:11px;row-gap:3px;align-items:center}
  .sbrand{display:contents}
  .titlerow{grid-column:2;grid-row:1;flex-wrap:nowrap;min-width:0}
  .titlerow h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .lvl{grid-column:3;grid-row:1;justify-self:end;align-self:center;flex:0 0 auto;font-size:.68rem;padding:2px 8px}
  .chead h3{font-size:1.1rem}                       /* 站名小一档 */
  .submeta{grid-column:1/-1;grid-row:2;font-size:.68rem;gap:4px}
  /* 窄屏底部三件套：小卡按内容宽度、邀请码/注册各占等分（仍是等宽等高）；
     等分宽度下"邀请码 + 码 + 复制"塞不进 103px，码会被压成 0 宽（看着像没写码）→ 窄屏去掉"复制"二字。 */

  /* 窄屏单栏布局不缺高度，说明文字不再限行数（桌面端保留三行是为了两栏齐平） */
  .desc{-webkit-line-clamp:unset;display:block;overflow:visible;min-height:0}
}

.hmini .bars i.dim{opacity:.42}
.monitor-stage{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
.monitor-stage>.mbody{flex:1}
.monitor-notice{font-size:.72rem;line-height:1.45;color:var(--bar-warn);margin:2px 0 5px}
.mblock[data-monitor-state="offline"] .monitor-notice{color:var(--bar-bad)}
.mblock.is-masked .monitor-stage{min-height:180px}
.mblock.is-masked .mbody{filter:blur(2px);opacity:.2;pointer-events:none;user-select:none}
.monitor-overlay{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;background:color-mix(in srgb,var(--surface) 84%,transparent);border-radius:9px}
.monitor-overlay strong{color:var(--text);font-size:.87rem}
.monitor-overlay p{max-width:34ch;font-size:.75rem;line-height:1.6;color:var(--muted);margin:0}
.monitor-overlay>span:last-child{font-size:.69rem;color:var(--date)}
.monitor-state-icon{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border:1px solid currentColor;border-radius:50%;color:var(--bar-warn);font-weight:800}
.mblock[data-monitor-state="offline"] .monitor-state-icon{color:var(--bar-bad)}
.hmini[data-current="down"]{border-left-color:var(--bar-bad)}
.hmini[data-current="unknown"]{border-left-color:var(--date)}
.hmini:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media(max-width:820px){
  .mblock.is-masked:not([data-user="1"]) .monitor-stage{min-height:125px}
  .monitor-overlay{padding:10px}
}
.mempty{font-size:.75rem;color:var(--date);flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 6px;line-height:1.6;max-width:44ch;margin:0 auto}   /* 无模型数据时（如站方接口需登录）：说明文字在面板里居中，别贴着顶留一大片空 */
.mlegend{display:flex;flex-direction:column;gap:3px;margin-top:0;padding-top:6px;border-top:1px solid var(--line);font-size:.65rem;color:var(--hint)}
.mline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mline>span{display:inline-flex;align-items:center;gap:3px}
.mlegend i{display:inline-block;width:6px;height:10px;border-radius:2px;background:var(--bar);flex:0 0 auto}
.mlegend i.soft{background:var(--bar-soft)}.mlegend i.warn{background:var(--bar-warn)}.mlegend i.bad{background:var(--bar-bad)}
.mlegend i+*{margin-left:-1px}
.mlegend i.dim{opacity:.42}
.mlegend i.none{background:var(--bar-none)}
html[data-theme=dark] .mlegend{color:var(--date)}

/* 邀请码 */
/* 标题行 + 直连/翻墙标识（探测结果直接来自本机两路可达性） */
.titlerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.net{flex:0 0 auto;font-size:.68rem;font-weight:750;padding:1px 7px;border-radius:6px;letter-spacing:.02em;
  border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-fg);white-space:nowrap}
/* 站址：行动按钮下一行的小灰字 */
/* 邀请码小标签 + 注册按钮同一排，等宽等高 */
.invite{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;padding:0 10px;
  border:1px solid var(--t-border);background:var(--t-bg);color:var(--t-fg);border-radius:10px;font-family:inherit}
.invite:hover{border-color:var(--t-solid)}
.invite .lb{font-size:.68rem;opacity:.8;flex:0 0 auto}
.invite .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;font-weight:800;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invite .cp{flex:0 0 auto;border:1px solid var(--t-border);background:var(--surface);color:var(--t-fg);
  border-radius:7px;padding:2px 8px;font-size:.68rem;font-weight:750}
.invite.copied{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.012)}100%{transform:scale(1)}}

/* 三列：小卡按内容宽度，邀请码/注册各占等分（保证两者仍等宽等高）。
   若三列都 1fr：左栏窄时（900px 两栏档 / 390px 窄屏）"邀请码 + 码 + 复制"塞不进 1/3 宽，码会被压成 0 宽。 */
.cfoot{display:grid;grid-auto-flow:column;grid-auto-columns:auto minmax(0,1fr) minmax(0,1fr);align-items:stretch;gap:9px}
  /* 站点域名（.host）与 `const host` 已在 2026-10-12 按用户要求删除：
     卡片元信息行只留「收录 X 天 · 检测 MM-DD」，不再显示 ai.furry.vg 这类网址。
     注册链接本身仍带域名（href），所以删掉显示不影响可点性。 */
.cfoot .invite{overflow:hidden}                       /* 空间真不够时裁掉标签，绝不裁掉码本身 */
.cfoot .invite .code{flex:0 0 auto}                    /* 码不参与收缩（安全网）*/                       /* 空间真不够时裁掉标签，绝不裁掉码本身 */
.cfoot .invite,.cfoot .golink{min-width:0;height:35px;box-sizing:border-box;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;
  font-size:.79rem;font-weight:750;font-family:inherit;text-decoration:none;white-space:nowrap}
.golink{border:1px solid var(--t-solid);background:var(--t-solid);color:var(--t-solid-ink);cursor:pointer}
.golink:hover{opacity:.9}

.empty{padding:36px 18px;text-align:center;color:var(--hint);font-size:.86rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}

footer{border-top:1px solid var(--line);margin-top:6px;padding-top:16px;color:var(--hint);font-size:.76rem;line-height:1.7}
footer b{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#1c2736;color:#fff;font-size:.82rem;padding:9px 15px;border-radius:11px;opacity:0;pointer-events:none;transition:.22s;z-index:9;box-shadow:0 8px 26px rgba(0,0,0,.25)}
html[data-theme=dark] .toast{background:#f3f5f9;color:#16202e}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- 指定模型监控（网格化：名称 + 4 列数字；模型小绿卡是近 24h 的真实桶） ---- */
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 52px 50px 50px 42px;align-items:center;gap:5px;font-size:.71rem}
.mgrid.mhdr{font-size:.62rem;color:var(--date);padding-bottom:4px;border-bottom:1px solid var(--line)}
.mgrid.mhdr .num{font-weight:600}
.mgrid .cname{display:flex;align-items:center;gap:6px;min-width:0}
.mgrid .nm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;font-weight:650;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgrid .num{color:var(--hint);font-size:.68rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.mgrid .num.rate{font-weight:750;font-size:.74rem;color:var(--text)}
.mgrid .num.rate.hi{color:#0f9d6f}.mgrid .num.rate.mid{color:#b07d15}.mgrid .num.rate.lo{color:#d14343}
html[data-theme=dark] .mgrid .num.rate.hi{color:#7fe0bb}html[data-theme=dark] .mgrid .num.rate.mid{color:#f0c674}html[data-theme=dark] .mgrid .num.rate.lo{color:#f3a1a1}
.mgrid.g{padding-left:2px}
.mgrid .ratio{font-size:.6rem;color:var(--hint);border:1px solid var(--line);border-radius:5px;padding:0 4px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.mgrid .ratio.free{color:#0f9d6f;border-color:#bfe8d8}
html[data-theme=dark] .mgrid .ratio.free{color:#7fe0bb;border-color:#2b544a}
.mrow .mbarrow{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
  /* .mbarrow 是 .mgrid 的**兄弟**、不是 .cname 的后代 —— 写成 .mgrid .cname .mbarrow 永远匹配不到，
     结果整行是 block：文字一行、小绿卡被挤到下一行，两个 inline 元素之间没空格所以贴在一起。 */
.slab{font-size:.6rem;color:var(--date);flex:0 0 auto}
.mstrip{display:flex;gap:2px;justify-content:flex-end;margin-left:auto;min-height:13px;min-width:0}
  /* min-width:0 + 块可收缩：24 根固定宽时 min-content 会撑破容器（窄屏上"近24h+徽章"占掉宽度后
     小绿卡会伸出行右边界、甚至顶出面板边框）。 */
.mstrip i{flex:0 1 auto;min-width:4px;width:10px;height:13px;border-radius:3px;background:var(--bar-none)}
.mstrip i.ok{background:var(--bar)}
.mstrip i.soft{background:var(--bar-soft)}
.mstrip i.warn{background:var(--bar-warn)}
.mstrip i.bad{background:var(--bar-bad)}
.mstrip i.dim{opacity:.42}
/* ---- 分组倍率（/api/pricing） ---- */
.rblock{display:flex;align-items:center;gap:9px;min-width:0;position:relative;border:1px solid var(--line);border-left:3px solid var(--t-solid);border-radius:12px;padding:8px 11px}
.rblock .rtitle{flex:0 0 auto;font-size:.7rem;color:var(--t-fg);font-weight:750;letter-spacing:.03em}
.rchips{flex:1 1 auto;min-width:0;display:flex;flex-wrap:nowrap;overflow:hidden;gap:5px}   /* 永不换行：宽度不够由 fitRatios() 收 chip */
@media (min-width:960px){.rchips{flex-wrap:nowrap;overflow:hidden}}  /* 倍率固定一行，用来锁定两栏高度 */
.rchip{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:1px 6px;font-variant-numeric:tabular-nums;
  flex:0 0 auto;white-space:nowrap}   /* 不可压缩：否则 chip 被压扁、文字在 chip 内折行，容器却"不溢出" */
.rchip b{font-weight:750;color:var(--hint)}
.rchip.free b{color:#0b7a4d}
.rchip.free{background:#e8f7ee;border-color:#bfe7cd;color:#12633c;font-weight:650}
html[data-theme=dark] .rchip.free{background:#17362c;border-color:#2f6455;color:#9fe0c1}
html[data-theme=dark] .rchip.free b{color:#7fe0bb}
.rchip.more{color:var(--date);cursor:pointer;user-select:none;background:transparent;font-family:inherit}
.rchip.more:hover{border-color:var(--t-solid);color:var(--text)}
.rchip.more::after{content:'▾';margin-left:1px}
.rchip.more[aria-expanded=true]::after{content:'▴'}
/* 悬浮面板：行本身保持单行不换行、卡片高度不变（absolute 不参与布局） */
.rpop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;display:flex;flex-wrap:wrap;gap:5px;
      background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 9px;
      box-shadow:0 14px 30px -14px rgba(15,23,42,.4)}
.rchip[hidden]{display:none}
.rchip.na{color:var(--date);border-style:dashed;cursor:default;font-weight:500}   /* 站方未公开：虚线灰，别做成可点 */
.rconv{flex:0 0 auto;font-size:.6rem;color:var(--date);white-space:nowrap}         /* 折算口径小字（仅 uc!=1 时出现） */
/* ---- 全部模型（站方 /api/pricing 目录口径）----
   摆在模型卡图例那一行的右侧，chip 与弹出面板**完全复用分组倍率那一套**（.rchip / .rpop），
   视觉与交互因此跟倍率列表一致。入口只有一个「全部模型 N 个」按钮，模型名 chips 默认 hidden、
   点开才铺进浮层 —— 不能让 fitRatios 逐个试宽度收起：一个站 233 个 chip 会强制重排几百次。 */
.rblock.all{margin-left:auto;border:0;border-left:0;padding:0;background:transparent;gap:0}
.rblock.all .rchips{flex:0 1 auto;overflow:visible}
.rblock.all .rpop{left:auto;right:0;min-width:min(440px,86vw);max-width:min(640px,86vw);max-height:320px;overflow:auto}
@media(max-width:760px){
  /* 窄屏：指标**只留成功率**，跟桌面端同布局 —— 名字 + 成功率一行搞定，不再折成"名字独占一行 + 
     4 个数字等分一行"（那版行高翻倍、卡片也跟着高）。表头同步隐藏第 3 项起，靠 nth-child 与实际列对齐。
     名字过长就截断加省略号（原来窄屏是 white-space:normal + overflow-wrap:anywhere，
     会把 deepseek-v4.1-flash-free 切成好几段）。 */
  .mgrid{grid-template-columns:minmax(0,1fr) 54px;gap:4px 8px}
  .mgrid>*:nth-child(n+3){display:none}
  .mgrid .cname{grid-column:auto}
  .mgrid .nm{max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 窄屏小绿块：一行只放模型名+成功率后条带能拿到整个行宽，8px 宽反而比 6px 好认 */
  .mbarrow{gap:6px}
  .mstrip{gap:1px}
  .mstrip i{width:8px;min-width:4px;height:12px;border-radius:2px}
}
/* ---- 右下角悬浮按钮（返回顶部 / 刷新）----
   两个按钮竖排、position:fixed 贴视口右下。返回顶部滚过 240px 才淡入、到顶自动淡出
   （放一个点了没反应的按钮在顶上没意义）；刷新常驻。
   颜色全走主题变量，深色模式自动跟随；图标用内联 SVG，不吃系统字体差异。 */
.fab{position:fixed;z-index:60;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px}
.fab-btn{width:46px;height:46px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--hint);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--fab-shadow);
  transition:transform .16s ease,color .16s ease,border-color .16s ease,opacity .22s ease}
.fab-btn svg{width:21px;height:21px;display:block}
.fab-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.fab-btn:active{transform:translateY(0) scale(.95)}
.fab-btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.fab-btn.top{opacity:0;transform:translateY(10px);pointer-events:none}
.fab-btn.top.show{opacity:1;transform:translateY(0);pointer-events:auto}
.fab-btn.reload.spin svg{animation:fabspin .42s ease}
@keyframes fabspin{to{transform:rotate(360deg)}}
@media (max-width:600px){.fab{right:14px;bottom:14px;gap:8px}
  .fab-btn{width:42px;height:42px}.fab-btn svg{width:19px;height:19px}}
@media (prefers-reduced-motion:reduce){.fab-btn,.fab-btn.top{transition:none}
  .fab-btn.reload.spin svg{animation:none}}

</style>
</head>
<body>
<div class="shell">

  <header class="top">
    <div class="brand"><span class="logo">✦</span>AI 福利站 · 推荐站点</div>
    <div class="spacer"></div>
    <button class="btn-ghost" id="theme">☾ 主题</button>
    <span class="brk" aria-hidden="true"></span>
    <a class="btn-ghost back" href="index.html"><span aria-hidden="true">←</span> 返回信息列表</a>
  </header>

  <section class="hero">
    <div class="eyebrow">推广 · 我的邀请站</div>
    <h1>这些中转站，我自己在用，顺手给你。</h1>
    <div class="stats" id="stats"></div>
  </section>

  <section class="controls">
    <div class="searchrow">
      <label class="search"><span class="ic">⌕</span><input id="q" type="search" placeholder="搜站名、说明、标签…" autocomplete="off"></label>
      <select id="sort" aria-label="排序">
        <option value="health">按健康度</option>
        <option value="new">按收录时间</option>
        <option value="name">按站名</option>
      </select>
      <label class="chk"><input type="checkbox" id="only-ok">只看健康站</label>
    </div>
    <div class="chips" id="tagchips"></div>
  </section>

  <div id="list"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================================
   数据区（这段 PROMO 由 promo-health/bake_preview.py 整段重写，手改会被下次烘焙覆盖）
   ----------------------------------------------------------------------------
   卡片字段：
     name / url / code      站名 ｜ 带邀请码的注册链接 ｜ 邀请码（留空则只显示注册按钮）
     desc / tags / tone     一句话说明 ｜ 标签（决定筛选芯片）｜ 配色键
     added_at               收录时间 YYYY-MM-DD（卡片上显示"收录 N 天"）
     pin                    true → 进"置顶推荐"分组
     logo                   内嵌 data:image/png;base64 —— 离线单文件，不发外部请求
     real                   true = 真实检测数据（卡片已不渲染任何标记，此字段留给"是否为真实采集"的语义）
     ratios                 [{g 分组名, r 倍率, d 分组说明}] ← /api/pricing 的 group_ratio
     health                 {score, level, rate_window, streak_days, days_with_data,
                             bars:[{d,rate,ok,buckets,sparse}], families, note}
     models                 [{n 模型名, in_site 站上 ID, pick:{g 分组, ratio 倍率, r 成功率%,
                             l 平均延迟ms, t 首token ms, tps, days 样本天数, anomaly 异常桶数,
                             bars_24h}, bars_24h 近24h桶, free_group, low_sample}]
     monitor_mode           'models' = 人工指定（配几个显示几个）；'free' = 自动挑免费分组 TopN
     free_pool / free_groups / free_with_data / free_min_buckets   仅 free 模式有
   新增一个站：① sites.json 加监控配置 ② bake_preview.py 的 PROMO_META 加推广信息
              ③ python3 health_check.py --report ④ python3 bake_preview.py
              详见 promo-health/README.md
   ========================================================================== */
/* 最近一次检测时间戳（由 bake_preview.py 每次烘焙写入，取自 health.json 的 generated_at）。
   整点脚本每 30 分钟跑一轮，页面是静态快照 —— 这里必须用**采集时间**，
   不能用浏览器当前时间（那会显示"用户打开页面的时刻"，与数据实际新鲜度无关）。 */
const CHECKED_AT = "10-31 11:38";
const PROMO = [
  {
    "name": "KiosAPI",
    "url": "https://kiosapi.com/sign-up?aff=Xs7Q",
    "code": "Xs7Q",
    "added_at": "2026-10-09",
    "tone": "green",
    "pin": false,
    "desc": "公益分组长期开放：Free 分组可用，Free-Pro 分组需要充值 1$，网站不建议充值，不划算。",
    "tags": [
      "公益"

/* 日期：CST 日期字符串。直接用 toISOString 会因 UTC 偏移少一天，先加 8 小时偏移再取日期。 */
const cstNow=()=>new Date(Date.now()+8*3600e3);
const isoDay=d=>d.toISOString().slice(0,10);
const TONES=['purple','green','teal','blue','amber','rose'];
const LV_TONE={'优':'green','良':'teal','可用':'amber','异常':'rose'};
const ALL_TAGS=[...new Set(PROMO.flatMap(s=>s.tags||[]))];   // 筛选条：标签按钮由数据推导，不写死
const state={q:'', tags:new Set(), sort:'health', onlyOk:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function barClass(b){
  let c;
  if(b.rate===null||b.rate===undefined) c='none';
  else if(b.rate>=99.9) c='ok';
  else if(b.rate>=95) c='soft';
  else if(b.rate>=70) c='warn';
  else c='bad';
  return (b.sparse && c!=='none') ? c+' dim' : c;   // 采样偏少 → 淡化，别把 1 个采样桶的 0% 当全天宕机
}

function fmtMs(v){
  if(v===null||v===undefined||isNaN(v)||v<=0) return '—';
  return v>=1000? (v/1000).toFixed(1)+'s' : Math.round(v)+'ms';
}

/* 健康度块：30 天条带 + 日期 + 可用率/连续天数 */
/* 站点可用率小卡：只取近 3 天（早前是横贯整栏的 30 天条带，太大且 29 格全灰没信息量）。
   3 根绿块 = 最近 3 个自然日，右端是今天；灰 = 当天没有检测样本。日期/口径进 title，正文不占位。 */
const LIVE_MAX_AGE_MS=90*60e3;
function checkedTime(value){
  if(typeof value!=='string'||!value.trim()) return NaN;
  const text=value.trim();
  return Date.parse(/[zZ]|[+-]\d\d:\d\d$/.test(text)?text:text.replace(' ','T')+'+08:00');
}
function recentState(h,now=Date.now()){
  const raw=h&&h.current||{}, stamp=checkedTime(raw.checked_at), delta=now-stamp;
  const sameDay=Number.isFinite(stamp)&&new Date(stamp+8*3600e3).toISOString().slice(0,10)===new Date(now+8*3600e3).toISOString().slice(0,10);
  const inWindow=delta>=0&&delta<=LIVE_MAX_AGE_MS;
  /* 两个口径分开：
     fresh    = 今天有没有检测（可用率条带的"今天"按自然日叙事，跨零点后昨天的不算今天）；
     reachable= 当前状态是否已知（跨零点后 90 分钟内的检测仍然算数）。
     2026-10-25 用户报告：0 点后四张卡全部"待确认"约 38 分钟，就是后者误用了前者。 */
  const fresh=sameDay&&inWindow;
  return {fresh,stale:Number.isFinite(stamp)&&delta>LIVE_MAX_AGE_MS,
    checked_at:raw.checked_at||'',reachable:inWindow&&typeof raw.reachable==='boolean'?raw.reachable:null};
}
function localStamp(value){
  const stamp=checkedTime(value);
  return Number.isFinite(stamp)?new Date(stamp+8*3600e3).toISOString().slice(5,16).replace('T',' '):'无检测时间';
}
function healthHtml(h,now=Date.now()){
  if(!h) return '';
  const today=new Date(now+8*3600e3).toISOString().slice(0,10), raw=h.bars||[];
  const recent=recentState(h,now), bars=[];
  for(let offset=2;offset>=0;offset--){
    const day=new Date(now+8*3600e3-offset*864e5).toISOString().slice(0,10);
    const sample=raw.find(b=>b.d===day)||{d:day,rate:null,checks:0,failures:0};
    let color, description;
    if(day===today){
      color=recent.fresh?(recent.reachable===true?'ok':recent.reachable===false?'bad':'none'):'none';
      description=recent.fresh?(recent.reachable===true?'最近一次可达':recent.reachable===false?'本次不可达':'尚无有效检测'):(recent.stale?'检测已过期，待更新':'尚无有效检测');
      description+=recent.checked_at?'；检测 '+localStamp(recent.checked_at):'';
    }else{
      color=barClass(sample);
      const known=typeof sample.rate==='number'&&Number.isFinite(sample.rate);
      description=known?'可达率 '+sample.rate+'%':'无有效检测';
      if(known&&Number.isInteger(sample.checks)&&Number.isInteger(sample.failures)){
        description+='；不可达 '+sample.failures+'/'+sample.checks+' 个检测小时';
      }
      if(sample.missing_hours) description+='；缺测 '+sample.missing_hours+' 小时（不计失败）';
    }
    bars.push({day,color,description});
  }
  const tip='站点状态：今天取最近检测；历史按小时统计可达率。绿≥99.9%，浅绿≥95%，黄≥70%，红<70%，灰为缺测或待更新。';
  const strip=bars.map(b=>`<i class="${b.color}" data-day="${esc(b.day)}" title="${esc(b.day+' '+b.description)}"></i>`).join('');
  const status=recent.reachable===true?'up':recent.reachable===false?'down':'unknown';
  const summary=bars.map(b=>b.day+' '+b.description).join('；');
  return `<div class="hmini" data-current="${status}" tabindex="0" aria-label="${esc(summary)}" title="${esc(tip+' '+summary)}">
    <span class="lb">近3天</span><div class="bars">${strip}</div></div>`;
}

/* 指定模型监控：每站只显示可用率最高的 TOP_N 个（数字与条带都取近 24h，含业务拒绝）。
   每个模型只显示"最便宜/免费的那一个分组"（脚本已选好：倍率 0 优先，其次最低倍率，再其次样本更多），
   一行 = 模型名 + 分组×倍率 + 异常桶 + 成功率/平均延迟/首token/TPS，下一行是近 24 小时小绿卡。
   条带只画站方有数据的桶（接口的桶是稀疏的：有的模型 24h 只有 2 个桶），右对齐 —— 右端就是现在。 */
const TOP_N=3;
function nums4(r,l,t,tps){
  const c=(r===null||r===undefined)?'':r>=95?'hi':r>=80?'mid':'lo';
  const pc=(r===null||r===undefined)?'—':r.toFixed(1)+'%';
  return `<span class="num rate ${c}">${pc}</span>`
       + `<span class="num">${fmtMs(l)}</span><span class="num">${fmtMs(t)}</span>`
       + `<span class="num">${tps?Math.round(tps):'—'}</span>`;
}
function stripHtml(bars,cls){
  return `<div class="${cls}">${(bars||[]).map(b=>
    `<i class="${barClass(b)}" title="${esc(b.d)} ${b.rate===null||b.rate===undefined?'无数据':b.rate+'%'}"></i>`).join('')}</div>`;
}
/* 全部模型：站方 /api/pricing 目录里的**全部**模型名（含从没被调用过的），按名称排序。
   与分组倍率共用同一套 chip + 弹出面板（toggleMore 直接吃 .rchip.more），摆在图例那一行右侧。
   拿不到 /api/pricing 的站返回空串 —— 不编数据，跟倍率「站方未公开」同一原则。 */
function allModelsHtml(s){
  const ms=s.all_models||[];
  if(!ms.length) return '';
  const chips=ms.map(n=>`<span class="rchip" hidden>${esc(n)}</span>`).join('');
  return `<div class="rblock all"><div class="rchips" data-fixed="1">${chips}<button class="rchip more" type="button" aria-expanded="false">全部模型 ${ms.length} 个</button></div></div>`;
}
function modelPanelState(s,now=Date.now()){
  const current=recentState(s.health,now), declared=s.model_state||{};
  if(current.stale) return {status:'stale',masked:true,title:'监控数据待刷新',detail:'上次检测 '+localStamp(current.checked_at)+'。旧数据不代表当前状态。'};
  if(current.reachable===false) return {status:'offline',masked:true,title:'站点暂时不可达',detail:'最近检测 '+localStamp(current.checked_at)+'；本次未取得可用模型数据。'};
  if(current.reachable===null) return {status:'unknown',masked:true,title:'站点状态待确认',detail:'当前没有有效检测记录，不以缺测代替宕机。'};
  if(declared.status==='not_configured') return {status:'not_configured',masked:false,title:'未配置监控模型',detail:''};
  const models=s.models||[];
  const valid=models.filter(m=>m.delisted||Number.isFinite((m.pick&&m.pick.g)?m.pick.r:m.r)).length;
  const status=declared.status||(models.length?(valid===models.length?'ready':valid?'partial':'unavailable'):'unavailable');
  if(status==='unavailable') return {status,masked:true,title:'模型数据暂不可用',detail:'站点可达，但模型接口本次无有效数据；这不等于模型成功率为 0%。'};
  if(status==='partial') return {status,masked:false,title:'部分模型缺少数据',detail:'已取得的数据正常显示，缺测项标为 —，不以其他分组指标替代。'};
  return {status:'ready',masked:false,title:'',detail:''};
}

      : (s.monitor_mode==='models'
        ? '人工指定的监控模型；成功率/延迟/TPS 均取该站的免费分组（Free，计费倍率 ×0）'
        : `从本站 ${s.free_pool||'?'} 个免费分组模型里取可用率最高的 ${TOP_N} 个（样本少于 ${s.free_min_buckets||6} 小时的排在后）`);
  const head=`<div class="mhead"><div class="mtitle" title="${esc(pickWhy)}">${esc(pickTitle)}</div>
    <button class="mtoggle" type="button" aria-expanded="${openNow?'true':'false'}">${openNow?'收起':(ms.length?'展开 '+ms.length+' 个模型':'展开')}</button></div>`;
  const notice=panel.title?`<div class="monitor-notice" role="status">${esc(panel.title)}</div>`:'';
  const directory=panel.masked&&s.all_models&&s.all_models.length?`<div class="monitor-directory">${allModelsHtml(s)}</div>`:'';
  const wrap=content=>`<div class="mblock${panel.masked?' is-masked':''}" data-monitor-state="${panel.status}"${userAttr}>${head}${notice}<div class="monitor-stage"><div class="mbody"${panel.masked?' aria-hidden="true" inert':''}>${content}</div>${panel.masked?`<div class="monitor-overlay"><span class="monitor-state-icon" aria-hidden="true">!</span><strong>${esc(panel.title)}</strong><p>${esc(panel.detail)}</p><span>下次检测成功后自动恢复</span></div>`:''}</div>${directory}</div>`;
  if(!ms.length) return wrap(`<div class="mempty">${esc(s.models_note||(panel.status==='not_configured'?'未配置监控模型':'本次无有效模型数据'))}</div>${panel.masked?'':allModelsHtml(s)}`);
  const hdr=`<div class="mgrid mhdr"><span class="cname">模型 / 分组</span><span class="num">成功率</span><span class="num">平均延迟</span><span class="num">首token</span><span class="num">TPS</span></div>`;
  const rows=ms.map(m=>{
    const p=m.pick||{};
    const locked=Boolean(p.g);
    const r=m.delisted?0:locked?p.r:m.r, l=locked?p.l:m.l, t=locked?p.t:m.t, tps=locked?p.tps:m.tps;
    const an=locked?p.anomaly:m.anomaly;
    const bars=m.delisted?[]:locked?(p.bars_24h||[]):(m.bars_24h||m.bars||[]);
    const ucM=Number(s.uc)||1;
    const pEff=(p.eff===null||p.eff===undefined)?p.ratio:p.eff;
    /* 补位来源要写在 chip 上：读者一眼就能看出"这个模型不是主组命中，是从倍率更小的组借来的" */
    const fillTag=(m.tier&&m.tier!=='hit')?(m.tier==='fill-main'?' · 补位(无关键词)':' · 补位'):'';
    const chip=p.g?`<span class="ratio${p.ratio===0?' free':''}" title="分组 ${esc(p.g)}${p.ratio!==null&&p.ratio!==undefined?` · 计费倍率 ×${p.ratio}（×0 = 免费）${ucM===1?'':`；按站方充值比例 1￥=${ucM}$ 折算后为 ×${pEff}`}`:''}${fillTag?'；主选中分组里命中关键词的模型不足，这个是从该分组补位来的':''}">${esc(p.g)}${p.ratio!==null&&p.ratio!==undefined?` ×${pEff}`:''}${esc(fillTag)}</span>`:'';
    const sample=(p.days!==null&&p.days!==undefined&&p.days<=3)?`<span class="mflag dim" title="该分组近 30 天只有 ${p.days} 天有数据，这个数字参考价值有限">仅 ${p.days} 天数据</span>`:'';
    /* 异常小时数分两级强调：≥6h（近一天里有四分之一以上小时不干净）用实心琥珀；
       1~5h 用淡底琥珀。**它衡量的是"稳定性"，不是失败比例** —— 有的模型异常小时多但总失败率仍 98%
       （请求量大、每小时零星失败），所以成功率颜色单独由 .num.rate 承担，两个信号不互相顶替。 */
    /* 异常小时数分级：>=6h 实心琥珀；1~5h 淡底琥珀。0 小时**不留白**：占位成三等宽的无底色
       span，否则同一张卡里"有徽章"和"没徽章"的行会差 1~2px（表格行高参差）。 */
    const flag=an?`<span class="mflag anom${an>=6?' severe':''}" title="近 24 小时中小时均值 &lt;95% 的小时数（站方口径的“异常桶”，阈值 95%）。它反映稳定性：异常小时多不等于失败请求比例高，请与左侧成功率一起看">异常 ${an}h</span>`
      :`<span class="mflag anom" data-empty="1" aria-hidden="true" style="visibility:hidden;border-color:transparent;background:transparent">&nbsp;</span>`;
    /* 模型下架（通用规则）：配置的模型已不在站方目录/已移出监控分组 → 成功率按 0 显示，
       "模型下架"顶掉"异常 Nh" —— 下架比"有 N 小时不干净"更根本。条带不画满格红：
       那等于宣称这 24 小时全在失败，而它可能是十分钟前刚下架的。 */
    const down=m.delisted?`<span class="mflag down" title="${esc((m.why? m.why+'；' : '')+'成功率按 0 计')}">模型下架</span>`:'';
    const none=(m.delisted||bars.length)?'':`<span class="mflag dim" title="近 24 小时这个分组没有采样桶，条带画不出来">近 24h 无样本</span>`;
    return `<div class="mrow">
      <div class="mgrid"><span class="cname"><b class="nm" title="${esc(m.in_site||m.n)}">${esc(m.n)}</b>${chip}</span>${nums4(r,l,t,tps)}</div>
      <div class="mbarrow"><span class="slab">近 24h</span>${sample}${down}${flag}${none}${stripHtml(bars,'mstrip')}</div></div>`;
  }).join('');
  const legend=`<div class="mlegend">
    <div class="mline"><span><i class="ok"></i>100%</span><span><i class="soft"></i>≥95%</span><span><i class="warn"></i>≥70%</span><span><i class="bad"></i>&lt;70%</span><span><i class="none"></i>无数据</span>${panel.masked?'':allModelsHtml(s)}</div>
  </div>`;
  return wrap(`${hdr}${rows}${legend}`);
}

/* 分组倍率：站方 /api/pricing 公开字段（group_ratio + usable_group 说明）。
   含义 —— ×1 = 基准价，越低越便宜，×0 = 免费（公益站常见）。
   折算：站方充值比例不等于 1￥=1$ 时（s.uc != 1），显示的是**折算后的等效倍率**（数据层算好 x.eff = 名义 ÷ uc）。
   不这么做的话，1￥=50$ 的站挂个「×7」会被读成"贵 7 倍"，而它实际只相当于 ×0.14 —— 名义倍率在跨站之间没有可比性。 */
const effOf=x=>(x.eff===null||x.eff===undefined)?x.r:x.eff;
function ratiosHtml(s){
  const uc=Number(s.uc)||1;
  const rs=(s.ratios||[]).slice().sort((a,b)=>a.r-b.r||String(a.g).localeCompare(String(b.g)));
  if(!rs.length){
    const state=s.pricing_state||{};
    const restricted=state.status==='restricted';
    const label=restricted?'需登录查看':state.status==='ready'?'暂无分组倍率':'倍率数据暂不可用';
    const tip=restricted?'站方拒绝匿名访问倍率接口（HTTP '+state.http+'）。':state.status==='ready'?'站方本次返回空目录。':'本次没有取得有效倍率数据，不能据此断言站方未公开。';
    return `<div class="rblock"><span class="rtitle">分组倍率</span><div class="rchips"><span class="rchip na" title="${esc(tip)}">${label}</span></div></div>`;
  }
  const all=esc(rs.map(x=>x.g+' ×'+effOf(x)).join(' · '));
  const conv=uc===1?'':`<span class="rconv" title="站方充值比例 1￥=${uc}$；此处倍率已折算成「相对 1￥=1$ 基准」的等效倍率（名义倍率 ÷ ${uc}），这样各站之间才可比">折算 1￥=${uc}$</span>`;
  return `<div class="rblock"><span class="rtitle">分组倍率</span>${conv}<div class="rchips" data-all="${all}">${rs.map(x=>{
    const e=effOf(x);
    const tip=uc===1?(x.d||x.g+' 倍率 ×'+x.r):(x.g+'：名义 ×'+x.r+' ÷ '+uc+' = ×'+e+(x.d?'；'+x.d:''));
    return `<span class="rchip${x.r===0?' free':''}" title="${esc(tip)}">${esc(x.g)} <b>×${e}</b></span>`}).join('')}<button class="rchip more" type="button" hidden aria-expanded="false"></button></div></div>`;
}

/* 倍率永远只占一行：先全摆出来，再按真实宽度从末尾收起，"其余 N 个"报的就是收掉的数量。
   不写死"前 4 个"——卡片宽度随窗口变，写死必然在某档宽度溢出（overflow:hidden 会静默截断）。 */
function fitRatios(root){
  (root||document).querySelectorAll('.rchips').forEach(el=>{
    const chips=[...el.querySelectorAll('.rchip:not(.more)')], more=el.querySelector('.rchip.more');
    if(!more||!chips.length||el.dataset.fixed) return;   /* data-fixed：入口自带「全部」按钮，不参与逐个收起 */
    const total=chips.length; let vis=total;
    const paint=()=>{ closePops(); chips.forEach((c,idx)=>{c.hidden=idx>=vis;});
      more.hidden=vis>=total; more.title=el.dataset.all||'';
      more.textContent=vis<total?`其余 ${total-vis} 个`:''; };
    paint();
    for(let g=0; g<total && el.scrollWidth>el.clientWidth; g++){ vis--; paint(); }
  });
}

/* "其余 N 个" 要能点开看全部分组倍率。
   这一行要求"永不换行"、两栏还要等高，所以不能靠展开成多行 —— 用绝对定位的面板：
   行本身不动、卡片高度不变，面板浮在下方（数据就是行里那些 chip 的原样拷贝，不另存一份）。 */
function closePops(){
  document.querySelectorAll('.rpop').forEach(p=>{
    const b=p.parentElement&&p.parentElement.querySelector('.rchip.more');
    if(b) b.setAttribute('aria-expanded','false');
    p.remove();
  });
}
function toggleMore(btn){
  const rb=btn.closest('.rblock'); if(!rb) return;
  if(rb.querySelector('.rpop')){ closePops(); return; }
  closePops();
  const chips=[...rb.querySelectorAll('.rchip:not(.more)')];
  const pop=document.createElement('div'); pop.className='rpop';
  pop.innerHTML=chips.map(c=>`<span class="rchip${c.classList.contains('free')?' free':''}">${c.innerHTML}</span>`).join('');
  rb.appendChild(pop); btn.setAttribute('aria-expanded','true');
}

/* 页面渲染/窗口缩放/滚动条出现都会改卡片宽度。只监听 window resize 会踩"按旧宽度收紧完又溢出"，
   所以直接盯 .rchips 自己的宽度（ResizeObserver 在布局落定后触发，比 resize 可靠）。 */
let _ratioRO=null;
const _ratioW=new WeakMap();
function watchRatios(){
  if(!('ResizeObserver' in window)) return;
  if(!_ratioRO) _ratioRO=new ResizeObserver(es=>{
    let moved=false;
    es.forEach(e=>{ const w=e.contentRect.width; if(Math.abs((_ratioW.get(e.target)||0)-w)>0.5){ _ratioW.set(e.target,w); moved=true; } });
    if(moved){ clearTimeout(window.__rf); window.__rf=setTimeout(()=>fitRatios(),0); }
  });
  _ratioRO.disconnect();
  document.querySelectorAll('.rchips').forEach(el=>{ _ratioW.set(el,el.getBoundingClientRect().width); _ratioRO.observe(el); });
}

/* 窄屏断点：评分徽章的位置、模型面板的折叠态都跟它走。切断点要重渲染，否则徽章会留在错误的那一侧。 */
const MOB_MQ=window.matchMedia('(max-width:820px)');
/* 手机端"展开模型"是用户手点的选择，必须跨重绘保留：render() 会把整个模型块重建，
   以前每次都按断点重置 → 手机上点一下标签筛选，刚展开的列表又收起来了。
   null = 用户还没点过，按断点取默认（窄屏收起、桌面展开）。 */
let MOB_OPEN=null;
function cardHtml(s){
  const h=s.health||null;
  const live=recentState(h);
  const lv=live.reachable===false?`<span class="lvl" data-tone="rose" title="最近一次检测不可达；综合评分仅反映已有历史样本">暂不可达</span>`
    :live.reachable===null?`<span class="lvl" data-tone="amber">${live.stale?'待更新':'待确认'}</span>`
    :h&&h.level?`<span class="lvl" data-tone="${LV_TONE[h.level]||'amber'}" title="${esc(h.note||'')}">${h.level} · ${h.score}</span>`
    :'<span class="lvl" data-tone="amber">待检测</span>';
  const days=Math.max(0,Math.round((Date.now()-new Date(s.added_at+'T00:00:00').getTime())/864e5));
  const tone=s.tone||TONES[0];
  /* 标签词表：只有这 5 个（bake_preview.py 复用 health_check.TAG_ORDER，会挡掉别的词）。
     每个标签固定配色，不随卡片主题漂移；卖点用实心、描述用淡底 ——
     一排同色小 chip 看起来"没有重点"，靠这个分出主次。 */
  /* 标签规则（用户 2026-10-09 制定，与 health_check.py 的 TAG_ORDER 同源）：
     公益=有免费渠道（倍率×0）  低价=有低倍率付费渠道（便宜但常降智）
     稳定=有稳定付费渠道、倍率较高  签到=签到得余额  赠金=注册一次性体验金 */
  const TAG_ORDER=['公益','低价','稳定','签到','赠金'];   /* 顺序 = 规则表顺序（用户口径） */
  const TAGS={
    '公益':{tone:'green', solid:true},    /* 硬福利：实心 */
    '赠金':{tone:'amber', solid:true},    /* 一次性赠送：实心 */
    '签到':{tone:'blue',  solid:false},   /* 要自己动手签到：淡底 */
    '低价':{tone:'purple',solid:false},   /* 属性：便宜，但降智风险 → 淡底 */
    '稳定':{tone:'teal',  solid:true},    /* 属性：花钱买质量 → 实心 */
  };
  const mine=[...(s.tags||[])].sort((a,b)=>{
    const ia=TAG_ORDER.indexOf(a), ib=TAG_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  const tags=mine.map(t=>{
    const m=TAGS[t]||{tone:tone, solid:false};   // 白名单外的词（理论上进不来）退化成淡色
    return `<span class="tag${m.solid?' hi':''}" data-tone="${m.tone}">${esc(t)}</span>`;
  }).join('');
  // logo：真实站点烘焙进 HTML 的 data URI；没有就退化成"首字母色块"，不编图标
  const initial=(s.name||'?').trim().charAt(0);
  const logo=s.logo?`<img class="slogo" src="${s.logo}" alt="">`:`<span class="slogo fb">${esc(initial)}</span>`;
  /* 直连 / 翻墙标识：直接来自本机两路探测（直连 + 本机代理）。
     访客最想知道的就是"我这网络打不打得开"——直连能通就标直连，只有走代理才通就标翻墙。 */
  const net=s.net||null;
  const NB=!net?null:live.reachable===null?{t:'amber',s:live.stale?'待更新':'待确认'}
          :(net.direct&&net.direct.ok)?{t:'green',s:'直连'}
          :(net.proxy&&net.proxy.ok)?{t:'amber',s:'翻墙'}:{t:'rose',s:'不通'};
  const msTxt=x=>x&&x.ms?' '+Math.round(x.ms)+'ms':'';
  const netTitle=!net?'':`直连${net.direct&&net.direct.ok?'可达'+msTxt(net.direct):"不可达"+(net.direct&&net.direct.code?'（HTTP '+net.direct.code+'）':'')}；代理${net.proxy&&net.proxy.ok?'可达'+msTxt(net.proxy):"不可达"+(net.proxy&&net.proxy.code?'（HTTP '+net.proxy.code+'）':'')}`;
  const netBadge=NB?`<span class="net" data-tone="${NB.t}" title="${esc(netTitle)}">${NB.s}</span>`:'';
  const _d=(h&&h.rate_window!==null&&(h.bars||[]).length)?String((h.bars||[]).slice(-1)[0].d):'—';
  const chk=esc(/^\d{4}-\d\d-\d\d$/.test(_d)?_d.slice(5):_d);   // 2026-10-09 → 10-09，和"今天"并排更清爽
  return `<article class="card${s.pin?' pin':''}" data-tone="${tone}" data-name="${esc(s.name.toLowerCase())}"
    data-tags="${esc((s.tags||[]).join(','))}" data-score="${h&&h.score!=null?h.score:-1}" data-added="${esc(s.added_at)}" data-site="${esc(s.name)}">
  <div class="body">
    <div class="chead">
      ${logo}
      <div class="sbrand">
        <div class="titlerow"><h3>${esc(s.name)}</h3>${netBadge}</div>
        <div class="submeta">
          <span class="k">收录</span><span class="v" title="收录日期 ${esc(s.added_at)}">${days<=0?'今天':days+' 天'}</span>
          <span class="k">·</span><span class="k">检测</span><span class="v">${chk}</span>
        </div>
      </div>
      ${lv}
    </div>
    <p class="desc">${esc(s.desc)}</p>
    <div class="tags">${tags}${s.recharge?`<span class="rcg" title="付费渠道充值比例（站方口径，运营填写）"><i>充值</i><b>${esc(s.recharge)}</b></span>`:''}</div>
    ${ratiosHtml(s)}
    <div class="cfoot">
      ${healthHtml(h)}
      ${s.code?`<button class="invite" type="button" data-tone="${tone}" data-code="${esc(s.code)}" title="点一下复制邀请码（注册链接已带码）">
        <span class="lb">邀请码</span><b class="code">${esc(s.code)}</b><span class="cp">复制</span></button>`:''}
      <a class="golink" href="${esc(s.url)}" target="_blank" rel="sponsored nofollow noopener">注册 <span class="arw" aria-hidden="true">↗</span></a>
    </div>
  </div>
  <aside class="side">
    ${modelsHtml(s)}
  </aside>
</article>`;
}

function visible(){
  const q=state.q.trim().toLowerCase();
  let list=PROMO.filter(s=>{
    if(q&&!(s.name+s.desc+(s.tags||[]).join('')).toLowerCase().includes(q)) return false;
    if(state.tags.size&&![...(s.tags||[])].some(t=>state.tags.has(t))) return false;
    if(state.onlyOk&&recentState(s.health).reachable!==true) return false;
    return true;
  });
  const cmp={ health:(a,b)=>((b.health&&b.health.score)||-1)-((a.health&&a.health.score)||-1),
              new:(a,b)=>String(b.added_at).localeCompare(String(a.added_at)),
              name:(a,b)=>a.name.localeCompare(b.name,'zh') }[state.sort];
  return list.sort(cmp);
}

function render(){
  const list=visible();
  const pins=list.filter(s=>s.pin), rest=list.filter(s=>!s.pin);
  const pinBlock = pins.length?`<section class="group"><div class="group-head"><h2>置顶推荐</h2>
     <span class="n">${pins.length}</span><span class="line"></span></div>
     <div class="cards">${pins.map(cardHtml).join('')}</div></section>`:'';
  const restBlock = rest.length?`<section class="group"><div class="group-head"><h2>${pins.length?'全部站点':'推荐站点'}</h2>
     <span class="n">${rest.length}</span><span class="line"></span></div>
     <div class="cards">${rest.map(cardHtml).join('')}</div></section>`:'';
  $('#list').innerHTML = (pinBlock+restBlock) || '<div class="empty">没有匹配的站点，换个关键词或清掉筛选试试</div>';

  const ok=PROMO.filter(s=>recentState(s.health).reachable===true).length;
  const bad=PROMO.filter(s=>recentState(s.health).reachable===false).length;
  const noData=PROMO.length-ok-bad;
  $('#stats').innerHTML=`
    <div><span class="k">共收录</span><b>${PROMO.length}</b> 个站点</div>
    <div><span class="k">当前可达</span><b>${ok}</b></div>
    <div><span class="k">当前不可达</span><b>${bad}</b></div>
    <div><span class="k">待确认</span><b>${noData}</b></div>
    <div><span class="k">最近检测</span><b>${CHECKED_AT}</b></div>`;
  fitRatios(); watchRatios();   // 卡片重绘后重新收紧倍率行，并盯住宽度变化
}

/* 换断点要重排（评分徽章位置、模型块折叠态）。两点讲究：
   ① 只听 matchMedia 的 change 不够 —— 后台标签页 / 无桌面会话（计划任务里跑的无头浏览器）
      会限流渲染循环，change 事件根本不派发，页面就停在旧断点（模型块该收起却还是展开）。
      所以 resize 也要听，并用**上次渲染的断点值**去重，避免 resize 风暴里重复 render。
   ② 不能靠 rAF 去抖（同一原因：rAF 可能只有 1 帧）。用 setTimeout，它是任务队列，不受渲染限流影响。 */
let LAST_MOB=null;
const syncBreakpoint=()=>{
  const now=MOB_MQ.matches;
  if(now===LAST_MOB) return;
  LAST_MOB=now;
  try{ render(); }catch(e){}
};
MOB_MQ.addEventListener('change',syncBreakpoint);
addEventListener('resize',()=>{ clearTimeout(window.__mqT); window.__mqT=setTimeout(syncBreakpoint,80); });
syncBreakpoint();
function renderTags(){
  $('#tagchips').innerHTML=ALL_TAGS.map(t=>{
    const n=PROMO.filter(s=>(s.tags||[]).includes(t)).length;
    return `<button class="chip" data-tag="${esc(t)}" aria-pressed="${state.tags.has(t)}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join('');
}

/* 复制 */
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true }catch(e){}
  try{
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.cssText='position:fixed;opacity:0;pointer-events:none';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false }
}
let toastTimer;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}

/* 事件 */
document.addEventListener('click',async e=>{
  const more=e.target.closest('.rchip.more');
  if(more){ toggleMore(more); return; }
  closePops();                       /* 点空白/别处收起倍率面板 */
  const tg=e.target.closest('.mtoggle');
  if(tg){
    const blk=tg.closest('.mblock');
    /* 当前是否展开**读真实可见性**，别读自己的属性：属性现在只记用户意图，默认态在 CSS 里 */
    const open=getComputedStyle(blk.querySelector('.mbody')).display==='none';
    blk.dataset.user=open?'1':'0';
    tg.setAttribute('aria-expanded',open?'true':'false');
    tg.textContent=open?'收起':`展开 ${blk.querySelectorAll('.mrow').length} 个模型`;
    MOB_OPEN=open;                    /* 记住用户的选择：render() 重建后也用这个 */
    return;
  }
  const chip=e.target.closest('.chip');
  /* 标签单选：点另一个直接切过去；点已选中的再点一次取消。
     原先写的是 toggle（Set 里加/删），于是能同时选中多个 —— 而筛选是 OR 语义，
     多选后很容易把列表筛空，看上去就像"点了没反应"（2026-10-15 用户报的）。 */
  if(chip){ const t=chip.dataset.tag;
    const was=state.tags.has(t);
    state.tags.clear();
    if(!was) state.tags.add(t);
    renderTags(); render(); return; }
  const inv=e.target.closest('.invite');
  if(inv){
    const code=inv.dataset.code||'';
    const ok=await copy(code);
    const btn=inv.querySelector('.cp');
    inv.classList.add('copied');
    if(btn) btn.textContent=ok?'✓ 已复制':'✗ 复制失败';
    toast(ok?`已复制邀请码 ${code}`:'浏览器不允许复制，请手动长按选择');
    setTimeout(()=>{ if(btn) btn.textContent='复制'; inv.classList.remove('copied') },1500);
  }
});
$('#q').addEventListener('input',e=>{ state.q=e.target.value; render() });
$('#sort').addEventListener('change',e=>{ state.sort=e.target.value; render() });
$('#only-ok').addEventListener('change',e=>{ state.onlyOk=e.target.checked; render() });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePops(); });
$('#theme').addEventListener('click',()=>{
  const root=document.documentElement, dark=root.dataset.theme==='dark';
  root.dataset.theme=dark?'light':'dark';
  try{ localStorage.setItem('promo-theme',root.dataset.theme) }catch(e){}
});
try{ if(localStorage.getItem('promo-theme')==='dark') document.documentElement.dataset.theme='dark' }catch(e){}

/* 布局自适应：只在这里绑定一次（2026-10-12 修复）。
   原先这两行被误粘贴进 document click 的 `if(chip)` 分支里 —— 每点一次标签 chip
   就多挂一个 resize 监听器，永不释放（实测点 5 次 → 5 个监听器）。
   它们与"点标签"毫无关系，是全局初始化逻辑。 */
addEventListener('resize',()=>{ clearTimeout(window.__rf); window.__rf=setTimeout(()=>fitRatios(),120); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>fitRatios());

renderTags(); render();
let statusClockKey='';
function refreshStatusClock(){
  const key=new Date(Date.now()+8*3600e3).toISOString().slice(0,10)+'|'+PROMO.map(s=>{const r=recentState(s.health);return String(r.reachable)+':'+r.stale}).join('|');
  if(statusClockKey&&statusClockKey!==key) render();
  statusClockKey=key;
}
refreshStatusClock();
setInterval(()=>{if(!document.hidden)refreshStatusClock()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshStatusClock()});

/* 右下角悬浮按钮：返回顶部 / 刷新。
   ⚠ 必须等 DOM 解析完再取元素：这段脚本所在的 <script> 排在 <div class="fab"> **之前**，
   同步执行时按钮还没被解析，getElementById 返回 null，整个功能会静默失效——
   不报错、不打日志，只有"按钮点了没反应"这一个症状（2026-10-15 踩过，
   是 verify_page.py 里"真滚真点"那两条断言把它揪出来的，光查元素存在与否查不到）。
   ⚠⚠ 按钮的出现/收起**不能依赖 scroll 事件或 requestAnimationFrame**（2026-10-16 实测）：
   无头/被限流的会话里 Chromium 的渲染循环不推进，`scrollTo` 明明改了 `scrollY`，
   但 **scroll 事件根本不派发**（探针实测事件计数 = 0），rAF 回调同样不执行 →
   类名永远不加、"滚下去按钮不出现"，而那正是发布断言门的一条（08:37 那轮就是这样
   被拦下的，线上页面因此停更一轮）。所以：同步比较 + 只在跨阈值时改类名，
   外加一条 400ms 的 setInterval 兜底轮询 —— 定时器排在任务队列上、不受渲染限流影响
   （与状态时钟同一套路）。有事件时仍走即时分支，真人观感无差别。 */
(function(){
  function init(){
    var top=document.getElementById('fabTop'), reload=document.getElementById('fabReload');
    if(!top||!reload) return;
    function onScroll(){
      var show=window.scrollY>240;
      if(show!==top.classList.contains('show')) top.classList.toggle('show', show);
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    setInterval(onScroll, 400);
    onScroll();
    top.addEventListener('click', function(){
      var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({top:0, behavior: reduce?'auto':'smooth'});
    });
    reload.addEventListener('click', function(){
      if(reload.classList.contains('spin')) return;
      reload.classList.add('spin');
      setTimeout(function(){ location.reload(); }, 380);
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

/* —— 访问统计（与主站同一套 welfare-hit）——
   副站页也要统计：path 会记成 /ai-welfare-daily/ai-welfare-promo-health.html，
   看板按 path 就能把两页分开；访客 ID 与主站共用同一把 localStorage 键（同 origin），
   所以同一个人逛两页只算一个访客。
   为什么第一句就判 location.protocol：副站页要过 verify_page.py 的 Playwright 校验，
   而校验是从 file:// 打开页面的；没有这道守卫，打点会在"零外部请求"那条检查上红
   （那条检查就是为了保证校验过程绝不联网）。只有 http(s)（线上页/本地预览）才发。
   三个会炸套件的坑（与主站同一套写法）：不新开 <script>；navigator.sendBeacon /
   location / localStorage 都要存在性守卫 + try/catch；只发字符串 body（简单请求）。 */
(function(){
  try{if(location.protocol!=='http:'&&location.protocol!=='https:')return}catch(e){return}
  var HIT='https://welfare-hit.1847531284.workers.dev/';
  function vid(){try{var v=localStorage.getItem('welfare-vid');if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('welfare-vid',v)}return v}catch(e){return ''}}
  function hit(p){try{if(typeof navigator==='undefined'||!navigator.sendBeacon)return;p.v=vid();try{p.p=location.pathname}catch(e){p.p=''}try{p.r=document.referrer||''}catch(e){p.r=''}navigator.sendBeacon(HIT,JSON.stringify(p))}catch(e){}}
  try{var later=function(){setTimeout(function(){hit({k:'view'})},1200)};if(document.readyState==='complete')later();else window.addEventListener('load',later)}catch(e){}
  /* 推荐页专用（2026-10-27）：站点卡片（article）带 data-site=站点名，点击时从最近的
     [data-site] 祖先读出、随 to_url 一起上报 —— 看板据此按站点聚合「注册跳转次数」
     （更早的记录没有这个字段，看板用域名兜底）。主站没有 data-site，该字段为空串，
     互不影响。⚠ data-site 必须挂在卡片上而不是链接上：verify_page.py 的窄屏/桌面探针
     用 [data-site] 选卡片，挂到 <a> 上会让它找不到 .titlerow/.chead 而拒发（2026-10-27 踩到）。 */
  try{document.addEventListener('click',function(e){try{var a=e.target&&e.target.closest&&e.target.closest('a[href]');if(!a)return;var h=a.href||'';if(!/^https?:/i.test(h))return;try{if(new URL(h).host===location.host)return}catch(e2){}hit({k:'click',t:h.slice(0,600),s:((a.closest&&a.closest('[data-site]'))||a).getAttribute('data-site')||''})}catch(err){}},true)}catch(e){}
})();
</script>
