eader-old');let filtered=getFiltered();if(sortMode==='time'){filtered=[...filtered].sort((a,b)=>{const at=Date.parse(a.created_at||a.fetched_at||0);const bt=Date.parse(b.created_at||b.fetched_at||0);return bt-at;});const groups={};filtered.forEach(c=>{const d=c.created_at||c.fetched_at||'';const key=d?d.slice(0,10):'未知日期';if(!groups[key]) groups[key]=[];groups[key].push(c);});const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));containerNew.style.display='none';containerOld.style.display='none';headerNew.style.display='none';headerOld.style.display='none';containerTime.style.display='';containerTime.innerHTML=keys.length?keys.map(k=>'<div class=\"section-header\">📅 '+escapeHtml(k)+'</div><div class=\"cards\">'+groups[k].map(renderCard).join('')+'</div>').join(''):'<div class=\"empty\">该筛选下暂无内容</div>';}else{filtered=[...filtered].sort((a,b)=>(b.score||0)-(a.score||0)||(Date.parse(b.fetched_at||0)-Date.parse(a.fetched_at||0)));containerTime.style.display='none';containerNew.style.display='';containerOld.style.display='';headerNew.style.display='';headerOld.style.display='';const newCards=filtered.filter(c=>c.is_new);const oldCards=filtered.filter(c=>!c.is_new);if(!newCards.length){containerNew.innerHTML='<div class=\"empty\">该筛选下暂无新帖</div>';}else{containerNew.innerHTML=newCards.map(renderCard).join('');}if(!oldCards.length){containerOld.innerHTML='<div class=\"empty\">该筛选下暂无旧帖</div>';}else{containerOld.innerHTML=oldCards.map(renderCard).join('');}if(!filtered.length){containerNew.innerHTML='<div class=\"empty\">该筛选下暂无内容</div>';containerOld.innerHTML='';}}}function escapeHtml(s){const div=document.createElement('div');div.textContent=s;return div.innerHTML;}function escapeAttr(s){return s.replace(/"/g,'&quot;').replace(/'/g,'&#39;');}function formatTime(iso){if(!iso) return '未知时间';try{const d=new Date(iso);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}filters.forEach(btn=>{btn.addEventListener('click',()=>{if(btn.dataset.sort){sortMode=btn.dataset.sort;filters.forEach(b=>{if(b.dataset.sort){b.classList.remove('active');}});btn.classList.add('active');render();return;}const group=btn.closest('.filter-row');if(group && group.dataset.group==='source'){sourceFilter=btn.dataset.filter;group.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();return;}if(group && group.dataset.group==='category'){categoryFilter=btn.dataset.filter;group.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();return;}});});render();</script></body></html>
