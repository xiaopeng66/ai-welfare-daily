inuxsb'))) return false;}else if(sourceFilter==='baipiao'){if(!(c.source&&c.source.startsWith('baipiao'))) return false;}else if(sourceFilter==='nodeloc'){if(!(c.source&&c.source.startsWith('nodeloc'))) return false;}else if(sourceFilter==='linuxdo'){if(!(c.source&&c.source.startsWith('linuxdo'))) return false;}}if(categoryFilter!=='all'){if(!(c.tags||[]).includes(categoryFilter)) return false;}return true;});return filtered;}function sourceLabel(s){if(!s) return '';if(s.indexOf('linuxsb')===0) return 'linux.sb';if(s.indexOf('baipiao')===0) return 'baipiao.org';if(s.indexOf('nodeloc_welfare')===0) return 'nodeloc 福利';if(s.indexOf('nodeloc')===0) return 'nodeloc.com';if(s.indexOf('linuxdo')===0) return 'linux.do';return s;}function renderCard(card){return '<a class="card" href="'+escapeAttr(card.url)+'" target="_blank" rel="noopener">'+'<div class="card-title">'+escapeHtml(card.title)+'</div>'+'<div class="card-meta">'+(Array.isArray(card.tags)?card.tags:[]).map(t=>'<span class="tag tag-'+escapeAttr(t)+'">'+escapeHtml(t)+'</span>').join('')+'</div>'+'<div class="card-footer"><span class="source">'+escapeHtml(sourceLabel(card.source))+'</span>'+'<span class="score">匹配度 '+(Number(card.score)||0)+'</span>'+'<span class="post-time">'+formatTime(card.created_at||card.fetched_at)+'</span></div></a>';}function render(){const containerNew=document.getElementById('cards-new');const containerOld=document.getElementById('cards-old');const containerTime=document.getElementById('cards-time');const headerNew=document.getElementById('header-new');const headerOld=document.getElementById('header-old');let filtered=getFiltered();if(sortMode==='time'){filtered=[...filtered].sort((a,b)=>{const at=Date.parse(a.created_at||a.fetched_at||0);const bt=Date.parse(b.created_at||b.fetched_at||0);return bt-at;});const groups={};filtered.forEach(c=>{const key=bjDateKey(c.created_at||c.fetched_at);if(!groups[key]) groups[key]=[];groups[key].push(c);});const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));containerNew.style.display='none';containerOld.style.display='none';headerNew.style.display='none';headerOld.style.display='none';containerTime.style.display='';containerTime.innerHTML=keys.length?keys.map(k=>'<div class=\"section-header\">📅 '+escapeHtml(k)+'</div><div class=\"cards\">'+groups[k].map(renderCard).join('')+'</div>').join(''):'<div class=\"empty\">该筛选下暂无内容</div>';}else{filtered=[...filtered].sort((a,b)=>(b.score||0)-(a.score||0)||(Date.parse(b.fetched_at||0)-Date.parse(a.fetched_at||0)));containerTime.style.display='none';containerNew.style.display='';containerOld.style.display='';headerNew.style.display='';headerOld.style.display='';const newCards=filtered.filter(isRecent);const oldCards=filtered.filter(c=>!isRecent(c));if(!newCards.length){containerNew.innerHTML='<div class=\"empty\">该筛选下近 24 小时没有新帖</div>';}else{containerNew.innerHTML=newCards.map(renderCard).join('');}if(!oldCards.length){containerOld.innerHTML='<div class=\"empty\">该筛选下暂无更早的帖子</div>';}else{containerOld.innerHTML=oldCards.map(renderCard).join('');}if(!filtered.length){containerNew.innerHTML='<div class=\"empty\">该筛选下暂无内容</div>';containerOld.innerHTML='';}}}function escapeHtml(s){const div=document.createElement('div');div.textContent=(s==null?'':s);return div.innerHTML;}function escapeAttr(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}function formatTime(iso){if(!iso) return '未知时间';try{const d=new Date(iso);return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Shanghai'});}catch(e){return iso;}}function bjDateKey(iso){if(!iso) return '未知日期';const d=new Date(iso);if(isNaN(d.getTime())) return '未知日期';return new Date(d.getTime()+8*3600*1000).toISOString().slice(0,10);}filters.forEach(btn=>{btn.addEventListener('click',()=>{if(btn.dataset.sort){sortMode=btn.dataset.sort;filters.forEach(b=>{if(b.dataset.sort){b.classList.remove('active');}});btn.classList.add('active');render();return;}const group=btn.closest('.filter-row');if(group && group.dataset.group==='source'){sourceFilter=btn.dataset.filter;group.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();return;}if(group && group.dataset.group==='category'){categoryFilter=btn.dataset.filter;group.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();return;}});});render();</script></body></html>
