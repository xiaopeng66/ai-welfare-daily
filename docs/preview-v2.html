function filtered(){let out=cards.filter(c=>(source==='all'||sourceKey(c.source)===source)&&(category==='all'||(c.tags||[]).includes(category))&&(!query||(c.title||'').toLowerCase().includes(query.toLowerCase())));out.sort((a,b)=>sort==='score'?((b.score||0)-(a.score||0)||stamp(b.created_at||b.fetched_at)-stamp(a.created_at||a.fetched_at)):stamp(b.created_at||b.fetched_at)-stamp(a.created_at||a.fetched_at));return out}
function safeURL(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function card(c){const url=safeURL(c.url);return `<article class="card"><div class="card-top"><span class="source">${esc(sourceName(c.source))}</span><span class="time" title="${c.created_at?'发布时间 · 北京时间':'未取得发布时间，显示收录时间 · 北京时间'}">${c.created_at?'':'收录于 '}${date(c.created_at||c.fetched_at)}</span></div><a class="card-title" ${url?`href="${esc(url)}" target="_blank" rel="noopener noreferrer"`:'aria-disabled="true"'} title="${esc(c.title||'未命名帖子')}">${esc(c.title||'未命名帖子')}</a><div class="card-bottom"><div class="tags">${(Array.isArray(c.tags)?c.tags:[]).map(t=>`<span class="tag">${icons[t]||'•'} ${esc(t)}</span>`).join('')}</div><span class="score" title="标题关键词匹配分，不代表质量或推荐">匹配 ${Number(c.score)||0}</span></div></article>`}
function dayKey(c){const t=stamp(c.created_at||c.fetched_at);return t?new Date(t+8*3600e3).toISOString().slice(0,10):'时间未知'}
function section(title,items,total){return `<section class="result-group"><div class="section-bar"><h2 class="section-title">${esc(title)}</h2><span class="section-note">${items.length===total?`${total} 条`:`显示 ${items.length} / ${total} 条`}</span></div><div class="cards">${items.map(card).join('')}</div></section>`}
function render(){const all=filtered(),show=all.slice(0,visible);$('#count').textContent=`${all.length} / ${cards.length} 条`;$('#total').textContent=cards.length+' 条';let output='';if(sort==='score'){const recent=c=>{const published=stamp(c.created_at||c.fetched_at);const age=Date.now()-published;return !!published&&age>=0&&age<864e5};for(const [title,test] of [['近 24 小时 · 发布 / 收录',recent],['更早的信息',c=>!recent(c)]]){const items=show.filter(test),total=all.filter(test).length;if(items.length)output+=section(title,items,total)}}else{const groups=new Map();show.forEach(c=>{const k=dayKey(c);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(c)});for(const [day,items] of groups){const today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);output+=section(day===today?'今天 · '+day:day,items,all.filter(c=>dayKey(c)===day).length)}}$('#content').innerHTML=output||'<div class="empty">没有找到匹配的信息<br><small>试试换个关键词，或点击「重置」</small></div>';if(all.length>visible)$('#content').insertAdjacentHTML('beforeend',`<div class="more"><button id="more" type="button">继续查看 · 还剩 ${all.length-visible} 条</button></div>`);$('#more')?.addEventListener('click',()=>{const prior=document.querySelectorAll('.card').length;visible+=80;render();const next=document.querySelectorAll('.card')[prior]?.querySelector('a');if(next)next.focus({preventScroll:true})})}
function active(group,attr,val){$$(`#${group} .chip`).forEach(b=>{const selected=b.dataset[attr]===val;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))})}
$('#search').addEventListener('input',e=>{query=e.target.value.trim();visible=80;render()});$('#reset').addEventListener('click',()=>{source=category='all';sort='latest';query='';visible=80;$('#search').value='';active('sources','source','all');active('categories','category','all');active('sorts','sort','latest');render()});$('#theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';$('#theme').textContent=dark?'☾':'☀';try{localStorage.setItem('ai-welfare-theme',dark?'light':'dark')}catch{};document.querySelector('meta[name="theme-color"]').content=dark?'#f6f7fb':'#10131d';$('#theme').setAttribute('aria-label',dark?'切换为深色主题':'切换为浅色主题')});$$('[data-sort]').forEach(b=>b.addEventListener('click',()=>{sort=b.dataset.sort;visible=80;active('sorts','sort',sort);render()}));document.addEventListener('click',e=>{if(e.target.matches('[data-source]')){source=e.target.dataset.source;visible=80;active('sources','source',source);render()}if(e.target.matches('[data-category]')){category=e.target.dataset.category;visible=80;active('categories','category',category);render()}});
let saved;try{saved=localStorage.getItem('ai-welfare-theme')}catch{};if(saved==='light'||saved==='dark'){document.documentElement.dataset.theme=saved;$('#theme').textContent=saved==='dark'?'☀':'☾'};initFilters();active('sources','source','all');active('categories','category','all');active('sorts','sort','latest');const newest=Math.max(...cards.map(c=>stamp(c.fetched_at)));$('#updated').textContent='更新于 '+date(new Date(newest).toISOString());render();let lastMinute=Math.floor(Date.now()/60000);setInterval(()=>{const minute=Math.floor(Date.now()/60000);if(minute!==lastMinute){lastMinute=minute;if(sort==='score'&&!document.hidden)render()}},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sort==='score')render()});
</script>
</body></html>
