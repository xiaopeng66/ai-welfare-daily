name: Daily Welfare Update

on:
  schedule:
    # 兜底用，不是主节奏：linux.do 在 CI 里被关掉了（数据中心 IP 会被 429），
    # 所以这条路径抓到的是与家宽侧相同的四源结果，真正带 linux.do 的完整抓取
    # 只能在家宽上跑（Windows 任务整点 + Hermes cron 半点，各每小时一次）。
    # 保持 6 小时一次，是为了让仓库在 Windows 机器长期离线时仍有新数据；
    # 提到每小时只是重复抓四源并增加并发冲突，对时效性没有帮助。
    #
    # 刻意选 01:00 UTC（北京 09:00）以外的位置：GitHub 官方说明 schedule 在高负载时
    # 会被延迟，且"每小时整点"是最堵的时段；实测这条 cron 曾连续多日延迟 3h45m~5h30m。
    - cron: '17 */6 * * *'
  workflow_dispatch:  # 允许手动触发

# The Windows scheduled task (\linuxsb-daily-08, hourly on the hour) and the
# Hermes cron job (hourly on the half hour) run the same pipeline on a
# residential IP; the half-hour offset plus run-update.ps1's -MaxAgeMinutes gate
# keep them from fetching the same forums twice in one hour.
# They all share one `concurrency` group so interleaving is absorbed by the
# pull --rebase below instead of racing for the branch.
concurrency:
  group: daily-welfare-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    # Pinned, not ubuntu-latest: the label migrates to Ubuntu 26 on 2026-10-19
    # and this job installs browser binaries through scrapling, which is exactly
    # the kind of thing a surprise base-image change breaks unattended.
    runs-on: ubuntu-24.04
    env:
      # linux.do answers GitHub runner (datacenter) IPs with 429, so this source
      # is only fetched by the Windows scheduled task on a residential IP.
      # Flip to "1" (the install step below is kept ready for it) if that
      # ever stops being true — otherwise every scheduled run goes red on
      # "linux.do welfare page 1: status=429".
      LINUXDO_ENABLED: "0"
    steps:
      # Pinned to commit SHAs: a moving major tag lets an upstream force-push
      # change what runs in a job that holds contents:write.
      # v7.0.1 / v7.0.0 are the first lines on the node24 runtime; the previous
      # v4/v5 pins still ran on node20 and were being force-upgraded on every
      # run ("Node.js 20 is deprecated").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Real history: the commit step rebases onto origin, which a depth-1
          # shallow clone cannot do reliably.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      # linux.do is Cloudflare-protected and is fetched through Scrapling's
      # StealthyFetcher. The core wheel alone is not enough: the [fetchers]
      # extra brings playwright/patchright AND click, which the `scrapling` CLI
      # needs. Without this the CI run is red on "scrapling not installed".
      #
      # Skipped while LINUXDO_ENABLED=0 (the default here): fetch.py skips that
      # source entirely, so the install only bought a browser download and a
      # fresh failure surface on every scheduled run. Flip the env var back to
      # "1" and this step comes back automatically.
      - name: Install scraper deps (Cloudflare-protected sources)
        if: env.LINUXDO_ENABLED != '0'
        run: |
          pip install "scrapling[fetchers]==0.4.8"
          scrapling install

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # Pre-flight: all four suites are hermetic (no network, every source
      # injected) and cover the "do not lose data | do not garble the page"
      # paths - including the parsers, whose fixtures encode the markup
      # anomalies that silently dropped rows and mis-paired timestamps, and the
      # page-JS suite, which this job is the last line of defence for: tests.yml
      # only runs after the push, so without it a garbled page is already live.
      # Fail closed here rather than let such a run write anything.
      - name: Guard tests (offline)
        run: |
          python3 tests/test_guards.py
          python3 tests/test_parsers.py
          python3 tests/test_site.py
          python3 tests/test_ab_rules.py
          node tests/test_page_js.mjs

      - name: Fetch topics from linux.sb
        run: |
          python3 fetch.py -o data/topics.jsonl

      - name: Generate static site
        run: |
          python3 generate.py -i data/topics.jsonl -o docs/index.html

      - name: Commit and push
        run: |
          git config --global user.name "linuxsb-daily-bot"
          git config --global user.email "bot@users.noreply.github.com"
          # Stage the whole tree here, unlike run-update.ps1 which stages only
          # data docs. The asymmetry is deliberate: this checkout is ephemeral
          # and holds nothing but this job's output, so `-A` guarantees the tree
          # is clean for the rebase below (an unstaged tracked file makes it
          # refuse, and then the autostash cannot be reapplied). On the user's
          # machine the tree can hold unrelated edits, so the PS1 stages only
          # what the run itself produced.
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily welfare update $(date +%Y-%m-%d)"
          # The Windows task runs this same job on the same wall clock, so the
          # branch can move between our commit and our push.
          if git push; then
            echo "push ok"
          else
            echo "push rejected - rebasing onto origin and retrying once"
            git fetch origin main
            if git rebase origin/main && git push; then
              echo "push ok after rebase"
            else
              # Rows are only rewritten when they change, so the two runners now
              # touch mostly disjoint lines and a rebase usually just works. If
              # it does not, keep this run's snapshot: it is a complete fetch and
              # the other side's rows are a subset of it.
              git rebase --abort 2>/dev/null || true
              # --autostash: without it a dirty tracked file anywhere in the tree
              # makes this fallback refuse, and then the run's whole fetch is
              # dropped at the "FAIL git push" below.
              git pull --no-rebase --autostash -X ours origin main
              git push
              echo "push ok after merge (kept this run's data)"
            fi
          fi

      # Runs last so a partial fetch still publishes good data, but marks the
      # build red so the failure is not silently swallowed.
      - name: Report partial fetch
        if: always()
        run: |
          if [ -f data/.fetch_errors ]; then
            echo "::error::Partial fetch - some sources failed, cached data kept:"
            cat data/.fetch_errors
            exit 1
          fi
          echo "All sources fetched cleanly"
