name: Daily Welfare Update

on:
  schedule:
    # 北京时间 08:00 和 20:00
    - cron: '0 0,12 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch topics from linux.sb
        run: |
          python3 fetch.py -o data/topics.jsonl

      - name: Generate static site
        run: |
          python3 generate.py -i data/topics.jsonl -o docs/index.html

      - name: Commit and push
        run: |
          git config --global user.name "linuxsb-daily-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/topics.jsonl data/seen_ids.txt docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily welfare update $(date +%Y-%m-%d)"
            git push
          fi
